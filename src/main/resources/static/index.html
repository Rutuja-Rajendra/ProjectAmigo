
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amigo - Voice Assistant</title>
	<link rel="stylesheet" href="style.css">
         
</head>

<body>
    <h1>AMIGO</h1>
    <p>Your personal voice assistant</p>

    <div id="orb" title="Click to speak"></div>
    <button id="talk">Talk to Amigo</button>

	<button id="newConversationBtn" type="button">
	    New Conversation
	</button>


    <p id="status"></p>
    <p id="heard"></p>
	<div id="reply" aria-live="polite">
	    <p>Hello! How can I help you?</p>
	</div>

    <script src="script.js"></script>
</body>
</html>
